# Uploaded by Vagrant's salt provisioner to /etc/salt/master on the controller.
#
# auto_accept is mandated by the assignment. It is only defensible because this
# master listens on an isolated host-only network nothing else can reach. The
# README states the tradeoff explicitly.
auto_accept: True

file_roots:
  base:
    - /vagrant/salt/states

pillar_roots:
  base:
    - /vagrant/salt/pillar
