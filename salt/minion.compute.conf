# Uploaded by Vagrant's salt provisioner to /etc/salt/minion on the compute node.
#
# The master address duplicates net:controller_ip from pillar, because this file
# is read to reach the master that serves pillar. The Vagrantfile could inject it
# via minion_json_config, but a plain file keeps the minion's bootstrap config
# inspectable on the node. Change both together.
master: 192.168.56.10

grains:
  role: compute
