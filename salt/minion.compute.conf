# Uploaded by Vagrant's salt provisioner to /etc/salt/minion on the compute node.
#
# The master address duplicates net:controller_ip from pillar. The chicken-and-
# egg is real (this file is read to reach the master that serves pillar) but not
# absolute: the Vagrantfile already parses common.sls on the host and could
# inject the address via minion_json_config. Kept as a plain file on purpose so
# the minion's bootstrap config stays inspectable on the node. Change both
# together.
master: 192.168.56.10

grains:
  role: compute
