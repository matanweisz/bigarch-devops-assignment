# Managed by Salt: salt/states/slurm/files/cgroup.conf
#
# Nothing here is tunable per node, so it is a plain file, not a template.
# autodetect picks the v2 hierarchy Ubuntu 24.04 boots with. Naming the plugin
# explicitly would break the day the lab moves to a v1 host.
CgroupPlugin=autodetect
ConstrainCores=yes
ConstrainRAMSpace=yes
