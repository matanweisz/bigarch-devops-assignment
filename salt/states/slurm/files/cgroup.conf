# Managed by Salt: salt/states/slurm/files/cgroup.conf
#
# Nothing in here is tunable per node, which is why it is a plain file and not a
# template. autodetect picks the v2 hierarchy Ubuntu 24.04 boots with; naming
# the plugin explicitly would break the day the lab moves to a v1 host.
CgroupPlugin=autodetect
ConstrainCores=yes
ConstrainRAMSpace=yes
