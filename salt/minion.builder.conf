# Uploaded by Vagrant's salt provisioner to /etc/salt/minion on the builder.
#
# Masterless: the builder is ephemeral, so it resolves states and pillar from
# the rsynced repo instead of exchanging keys with the controller's master.
file_client: local

file_roots:
  base:
    - /vagrant/salt/states

pillar_roots:
  base:
    - /vagrant/salt/pillar

# top.sls targets on this grain. It is the only thing selecting which states a
# node applies.
grains:
  role: builder
