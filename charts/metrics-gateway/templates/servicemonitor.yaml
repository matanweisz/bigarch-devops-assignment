apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "metrics-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics-gateway.labels" . | nindent 4 }}
    # Required: kube-prometheus-stack's Prometheus only watches ServiceMonitors
    # carrying its release label. Without this, the gateway is never scraped.
    release: {{ .Values.serviceMonitor.releaseLabel }}
spec:
  selector:
    matchLabels:
      {{- include "metrics-gateway.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: {{ .Values.service.portName }}
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
